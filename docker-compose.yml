name: hand-and-foot
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - ADMIN_PATH=${ADMIN_PATH:-/admin}
      - DB_PATH=/data/handf.db
    volumes:
      - .:/app                              # full repo (with .git) mounted into container
      - ./volumes/node_modules_client:/app/client/node_modules
      - ./volumes/node_modules_server:/app/server/node_modules
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
